# Un solo sitio: la SPA compilada en / y la API PHP en /api. PORT lo inyectan Render/Railway.
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # Los recursos de Vite llevan hash en el nombre: se pueden cachear sin límite.
    <LocationMatch "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
